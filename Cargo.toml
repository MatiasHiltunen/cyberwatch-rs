[package]
name = "cyberwatch-rs"
version = "0.4.1"
edition = "2024"
rust-version = "1.98.1"
description = "Local-first cyber-security news and CVE intelligence server backed by Turso/libSQL"
license = "MIT"

[lib]
name = "cyberwatch_rs"
path = "src/lib.rs"

[[bin]]
name = "cyberwatch-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tracing"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
feed-rs = "=2.3.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hex = "0.4"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[workspace]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Source adapters use catch_unwind so one failing source does not stop the server.
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
