apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: Pod
      name: cyberwatch-maintenance
    patch: |-
      - op: add
        path: /spec/securityContext/runAsUser
        value: 10001
      - op: add
        path: /spec/securityContext/runAsGroup
        value: 0
      - op: add
        path: /spec/securityContext/fsGroup
        value: 10001
