apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - route.yaml
patches:
  - path: storage.yaml
  - target:
      kind: NetworkPolicy
      name: cyberwatch-boundary
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: openshift-dns
      - op: replace
        path: /spec/egress/0/to/0/podSelector/matchLabels
        value:
          dns.operator.openshift.io/daemonset-dns: default
      - op: add
        path: /spec/egress/0/ports/-
        value:
          port: 5353
          protocol: UDP
      - op: add
        path: /spec/egress/0/ports/-
        value:
          port: 5353
          protocol: TCP
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  policy-group.network.openshift.io/ingress: ""
          ports:
            - port: 8080
              protocol: TCP
