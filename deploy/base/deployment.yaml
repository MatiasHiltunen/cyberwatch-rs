apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberwatch
  labels:
    app.kubernetes.io/name: cyberwatch
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  # SQLite is a single-writer local database. Never use RollingUpdate or HPA.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cyberwatch
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyberwatch
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: cyberwatch
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cyberwatch
          image: cyberwatch-rs:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cyberwatch-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: temporary
              mountPath: /tmp
            - name: admin-token
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cyberwatch-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
        - name: admin-token
          secret:
            secretName: cyberwatch-admin
            defaultMode: 0440
            items:
              - key: admin-token
                path: admin-token
