apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cyberwatch-boundary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cyberwatch
  policyTypes: [Ingress, Egress]
  ingress:
    # Explicitly authorized in-namespace callers (e.g. a smoke-test pod).
    - from:
        - podSelector:
            matchLabels:
              cyberwatch-access: "true"
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # NetworkPolicy has no portable FQDN rules. App also validates resolved IPs.
    # IPv6 is denied by omission. Add reviewed global IPv6 CIDRs if required.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - port: 443
          protocol: TCP
